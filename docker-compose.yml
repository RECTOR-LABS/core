name: core

services:
  postgres:
    image: postgres:16
    container_name: core-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: ${CORE_DATABASE_PASSWORD}
      POSTGRES_DB: core_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - core-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/rector-labs/core:latest
    container_name: core-web
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      CORE_DATABASE_PASSWORD: ${CORE_DATABASE_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      DB_HOST: postgres
    networks:
      - core-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  solidqueue:
    image: ghcr.io/rector-labs/core:latest
    container_name: core-solidqueue
    restart: unless-stopped
    command: ["bundle", "exec", "rake", "solid_queue:start"]
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      CORE_DATABASE_PASSWORD: ${CORE_DATABASE_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      DB_HOST: postgres
    networks:
      - core-net
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
    name: core-postgres-data

networks:
  core-net:
    driver: bridge
    name: core-network
